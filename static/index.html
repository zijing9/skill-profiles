<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SKILL本地管理</title>
<link rel="icon" href="/static/icon-black-128.png?v=2">
<style>
:root{
  --bg:#0a0a0d;
  --glass:rgba(255,255,255,.055);
  --glass-hi:rgba(255,255,255,.10);
  --stroke:rgba(255,255,255,.10);
  --text:#e9e9f2;
  --muted:#8f8fa8;
  --ok:#34d399;
  --warn:#fbbf24;
  --radius:20px;
    /* 纯黑（默认） */
  --a1:255,255,255; --a2:214,214,224; --a3:160,160,176;
  --g1:120,120,140; --g2:70,70,85;
  --s1:#ffffff; --s2:#d6d6e0;
  --t1:#e6e6ee; --t2:#f0f0f5; --t3:#ffffff; --t4:#9a9aa8; --t5:#7a7a88;
}
[data-theme="amber"]{
  --a1:245,158,11; --a2:251,191,36; --a3:253,230,138;
  --g1:234,88,12; --g2:217,119,6;
  --s1:#f59e0b; --s2:#fbbf24;
  --t1:#fde68a; --t2:#fef3c7; --t3:#fffbeb; --t4:#c9a86a; --t5:#a8894f;
}
[data-theme="violet"]{
  --a1:124,108,240; --a2:167,139,250; --a3:196,181,253;
  --g1:99,102,241;  --g2:139,92,246;
  --s1:#7c6cf0; --s2:#a78bfa;
  --t1:#c4b5fd; --t2:#ddd6fe; --t3:#e6e0ff; --t4:#a79ad6; --t5:#9d92c4;
}

[data-theme="black"]{
  --bg:#000000;
  --a1:255,255,255; --a2:214,214,224; --a3:160,160,176;
  --g1:120,120,140; --g2:70,70,85;
  --s1:#ffffff; --s2:#d6d6e0;
  --t1:#e6e6ee; --t2:#f0f0f5; --t3:#ffffff; --t4:#9a9aa8; --t5:#7a7a88;
}
[data-theme="white"]{
  --bg:#ffffff;
  --text:#15151d;
  --muted:#6b6b7d;
  --a1:20,20,30; --a2:60,60,80; --a3:110,110,130;
  --g1:200,200,215; --g2:225,225,235;
  --s1:#15151d; --s2:#3c3c50;
  --t1:#26263a; --t2:#3a3a50; --t3:#15151d; --t4:#6b6b7d; --t5:#8a8a9c;
}
[data-theme="white"] body{background:#ffffff}
[data-theme="white"] .aurora{opacity:0}
[data-theme="white"] .titlebar{background:transparent;border-bottom-color:transparent}
[data-theme="white"] .tb-title{color:#3a3a4e}
[data-theme="white"] .win-btn{color:#5a5a70}
[data-theme="white"] .win-btn:hover{background:rgba(20,20,30,.08);color:#111}
[data-theme="white"] aside{background:transparent;border-right-color:rgba(20,20,30,.08)}
[data-theme="white"] .search{background:#ffffff;border-color:rgba(20,20,30,.16);box-shadow:0 2px 8px rgba(20,20,30,.06)}
[data-theme="white"] .search input{color:#15151d}
[data-theme="white"] .search input::placeholder{color:#9a9aac}
[data-theme="white"] .nav-item{color:#4a4a60}
[data-theme="white"] .nav-item:hover{background:rgba(20,20,30,.06);color:#111}
[data-theme="white"] .nav-item.active{background:linear-gradient(90deg,rgba(20,20,30,.10),rgba(20,20,30,.04));border-color:rgba(20,20,30,.16);color:#111}
.nav-sep{height:1px;margin:11px 12px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.20),rgba(255,255,255,0))}
[data-theme="white"] .nav-sep{background:linear-gradient(90deg,rgba(20,20,30,0),rgba(20,20,30,.20),rgba(20,20,30,0))}
[data-theme="white"] .nav-item .cnt{background:rgba(20,20,30,.07);color:#5a5a70}
[data-theme="white"] .nav-item.active .cnt{background:rgba(20,20,30,.14);color:#111}
[data-theme="white"] .glass{background:#ffffff;border-color:rgba(0,0,0,.07);box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05)}
[data-theme="white"] .card:hover{border-color:rgba(20,20,30,.22);box-shadow:0 16px 40px rgba(20,20,30,.14)}
[data-theme="white"] .card .desc{color:#5a5a70}
[data-theme="white"] .card h3 .cn{color:#5f5f76}
[data-theme="white"] .card:hover h3 .cn{color:#1a1a26}
[data-theme="white"] .card h3 .cn{color:#4a4a62}
[data-theme="white"] .card-foot{border-top-color:rgba(20,20,30,.07)}
[data-theme="white"] .mini{color:#5a5a70}
[data-theme="white"] .mini:hover{background:rgba(20,20,30,.07);color:#111}
[data-theme="white"] .badge{border-color:rgba(20,20,30,.14);color:#4a4a62;background:rgba(20,20,30,.04)}
[data-theme="white"] .b-ok{color:#1f1f33;border-color:rgba(20,20,30,.35);background:rgba(20,20,30,.10)}
[data-theme="white"] .b-bundle{color:#3a3a50;border-color:rgba(20,20,30,.18);background:rgba(20,20,30,.06)}
.ed-overlay{position:fixed;inset:0;z-index:48;background:rgba(4,4,10,.55);backdrop-filter:blur(4px)}
.ed-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:49;
  width:86vw;height:86vh;max-width:1500px;max-height:1000px;display:flex;flex-direction:column;
  border-radius:20px;overflow:hidden;animation:edIn .22s cubic-bezier(.2,.9,.3,1);
  background:linear-gradient(180deg,rgba(23,23,34,.99),rgba(12,12,20,.99));
  border:1px solid rgba(255,255,255,.12);box-shadow:0 32px 90px rgba(0,0,0,.78),inset 0 1px 0 rgba(255,255,255,.06)}
@keyframes edIn{from{opacity:0;transform:translate(-50%,-50%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.ed-head{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.ed-title{font-size:13.5px;font-weight:650;color:#fff;letter-spacing:.2px}
.ed-sub{font-size:11.5px;color:#7d7d95}
.ed-close{margin-left:auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  cursor:pointer;color:#8f8fa8;transition:.16s}
.ed-close:hover{background:rgba(255,255,255,.10);color:#fff}
#edText{flex:1;width:100%;min-height:0;resize:none;border:none;outline:none;padding:18px 22px;
  font-family:Consolas,"Cascadia Mono",monospace;font-size:13px;line-height:1.78;
  color:#dcdcea;background:rgba(0,0,0,.28);tab-size:2}
#edText::-webkit-scrollbar{width:10px}
.ed-foot{display:flex;align-items:center;gap:8px;padding:13px 20px;border-top:1px solid rgba(255,255,255,.07);flex-shrink:0}
.ed-hint{font-size:11px;color:#6a6a82;margin-right:auto}
.ed-foot .btn{font-size:12.5px;padding:8px 15px}
[data-theme="white"] .ed-modal{background:#ffffff;border-color:rgba(20,20,30,.12)}
[data-theme="white"] .ed-head,[data-theme="white"] .ed-foot{border-color:rgba(20,20,30,.08)}
[data-theme="white"] .ed-title{color:#15151d}
[data-theme="white"] .ed-sub,[data-theme="white"] .ed-hint{color:#8a8a9c}
[data-theme="white"] .ed-close{color:#6b6b7d}
[data-theme="white"] .ed-close:hover{background:rgba(20,20,30,.07);color:#111}
[data-theme="white"] #edText{background:#fbfbfd;color:#2a2a3a}
.card-pin{position:absolute;top:13px;right:13px;width:27px;height:27px;border-radius:9px;
  display:grid;place-items:center;cursor:pointer;color:#6a6a82;opacity:0;
  transition:opacity .16s,background .16s,color .16s;z-index:2}
.card:hover .card-pin{opacity:1}
.card-pin.pinned{opacity:1;color:#a5b4fc}
.card-pin:hover{background:rgba(255,255,255,.10);color:#e4e4f0}
.card-pin.pinned:hover{color:#c7d2fe}
[data-theme="white"] .card-pin{color:#9a9aac}
[data-theme="white"] .card-pin.pinned{color:#4f46e5}
[data-theme="white"] .card-pin:hover{background:rgba(20,20,30,.07);color:#26263a}
.card-copy,.card-read{position:absolute;top:13px;height:27px;padding:0 9px;border-radius:9px;
  display:grid;place-items:center;cursor:pointer;font-size:10.5px;letter-spacing:.3px;
  color:#6a6a82;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
  opacity:0;transition:opacity .16s,background .16s,color .16s,border-color .16s;
  z-index:2;user-select:none}
.card-copy{right:46px}
.card-read{right:90px}
.card:hover .card-copy,.card:hover .card-read{opacity:1}
.card-copy:hover,.card-read:hover{background:rgba(255,255,255,.10);color:#e4e4f0;border-color:rgba(255,255,255,.16)}
[data-theme="white"] .card-copy,[data-theme="white"] .card-read{color:#8b8ba0;background:rgba(255,255,255,.7);border-color:rgba(20,20,30,.10)}
[data-theme="white"] .card-copy:hover,[data-theme="white"] .card-read:hover{background:rgba(20,20,30,.07);color:#26263a;border-color:rgba(20,20,30,.16)}
.b-count{color:#fcd34d;border-color:rgba(251,191,36,.34);background:rgba(251,191,36,.12);font-weight:600}
.b-warn{color:#6b6b7d;border-color:rgba(20,20,30,.12);background:rgba(20,20,30,.03)}
[data-theme="white"] .btn{background:rgba(255,255,255,.8);border-color:rgba(20,20,30,.10);color:#26263a}
[data-theme="white"] .btn:hover{background:#fff}
[data-theme="white"] .btn.primary{background:linear-gradient(135deg,#26263a,#4a4a66);color:#fff;box-shadow:0 6px 20px rgba(20,20,30,.22)}
[data-theme="white"] .pending{background:linear-gradient(180deg,rgba(245,158,11,.10),rgba(245,158,11,.035));border-color:rgba(245,158,11,.32);box-shadow:0 4px 16px rgba(245,158,11,.08)}
[data-theme="white"] .pending-h{color:#a16207}
[data-theme="white"] .pending-h .n{background:rgba(245,158,11,.18);color:#92400e}
[data-theme="white"] .p-item{border-top-color:rgba(245,158,11,.14)}
[data-theme="white"] .p-item .t{color:#3a2e12}
[data-theme="white"] .p-item .t i{color:#8a7440}
[data-theme="white"] .p-btn{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.42);color:#92400e}
[data-theme="white"] .p-btn:hover{background:rgba(245,158,11,.28);color:#78350f}
[data-theme="white"] .p-more{color:#a16207}
[data-theme="white"] .side-foot{background:rgba(255,255,255,.6);border-color:rgba(20,20,30,.08);color:#7a7a8e}
[data-theme="white"] .side-foot b{color:#3a3a50}
[data-theme="white"] .side-foot .hub-path{color:#4a4a62;text-decoration:underline dotted;text-underline-offset:2px}
[data-theme="white"] .side-foot:hover{background:rgba(20,20,30,.07);border-color:rgba(20,20,30,.18)}
[data-theme="white"] .side-foot:hover .hub-path{color:#15151d;text-decoration-style:solid}
[data-theme="white"] .side-foot:active{background:rgba(20,20,30,.11)}
[data-theme="white"] .confirmbar{background:linear-gradient(180deg,rgba(20,20,30,.05),rgba(20,20,30,.02));border-color:rgba(20,20,30,.16)}
[data-theme="white"] .confirmbar .cb-t{color:#2a2a3e}
[data-theme="white"] .confirmbar .cb-d{color:#4a4a62}
[data-theme="white"] .confirmbar .cb-d b{color:#15151d}
[data-theme="white"] .cb-to{color:#26263a;font-weight:700}
[data-theme="white"] .cb-note{color:#7a7a8e}
[data-theme="white"] .cb-btn{background:rgba(20,20,30,.06);border-color:rgba(20,20,30,.12);color:#26263a}
[data-theme="white"] .cb-btn.go{background:linear-gradient(135deg,#26263a,#4a4a66);color:#fff}
[data-theme="white"] .drawer{background:rgba(255,255,255,.92)}
[data-theme="white"] .d-head{border-bottom-color:rgba(20,20,30,.08)}
[data-theme="white"] .d-head p{color:#6b6b7d}
[data-theme="white"] .x{background:rgba(20,20,30,.06);border-color:rgba(20,20,30,.10)}
[data-theme="white"] .tab{color:#6b6b7d}
[data-theme="white"] .tab:hover{color:#111;background:rgba(20,20,30,.06)}
[data-theme="white"] .tab.on{color:#111;background:rgba(20,20,30,.10);border-color:rgba(20,20,30,.18)}
[data-theme="white"] .d-body{color:#3a3a50}
[data-theme="white"] .kv dt{color:#7a7a8e}
[data-theme="white"] .kv dd{color:#26263a}
[data-theme="white"] .code{background:rgba(20,20,30,.05);border-color:rgba(20,20,30,.08);color:#3a3a50}
[data-theme="white"] .log-item{background:rgba(20,20,30,.04);border-color:rgba(20,20,30,.06)}
[data-theme="white"] .log-item .t{color:#8a8a9c}
[data-theme="white"] .log-item .m{color:#26263a}
[data-theme="white"] .link-row{background:rgba(20,20,30,.04);border-color:rgba(20,20,30,.07)}
[data-theme="white"] .ghost{color:#3a3a50}
[data-theme="white"] .title h2{color:#111}
[data-theme="white"] .ico{background:rgba(20,20,30,.06)!important;color:#26263a!important}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  color:var(--text);
  background:#000;
  overflow:hidden;
}
/* 极光背景 */
.aurora{position:absolute;inset:-20%;z-index:0;pointer-events:none;filter:blur(90px);opacity:.62}
.aurora span{position:absolute;border-radius:50%;mix-blend-mode:screen}
.a1{width:62vw;height:62vw;left:-12%;top:-18%;background:radial-gradient(circle,rgba(var(--a1),.40),transparent 66%);animation:drift1 26s ease-in-out infinite}
.a2{width:52vw;height:52vw;right:-10%;top:2%;background:radial-gradient(circle,rgba(var(--g1),.26),transparent 66%);animation:drift2 32s ease-in-out infinite}
.a3{width:56vw;height:56vw;left:22%;bottom:-28%;background:radial-gradient(circle,rgba(var(--g2),.20),transparent 66%);animation:drift3 38s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,4%) scale(1.08)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5%,6%) scale(1.1)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-5%) scale(1.05)}}

.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;border-radius:18px;overflow:hidden;
  background:var(--bg);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.075),
    inset 0 1px 0 rgba(255,255,255,.10),
    inset 0 -1px 0 rgba(0,0,0,.55),
    inset 0 0 70px rgba(0,0,0,.38),
    0 24px 70px rgba(0,0,0,.72)}
[data-theme="white"] .app{
  background:#ffffff;
  box-shadow:
    inset 0 0 0 1px rgba(20,20,30,.09),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(20,20,30,.07),
    inset 0 0 60px rgba(20,20,30,.06),
    0 24px 70px rgba(20,20,30,.18)}

/* 标题栏（毛玻璃，自绘按钮） */
.titlebar{
  height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  padding-left:14px;
  background:transparent;
  border-bottom:none;
  user-select:none;
}
[data-theme="white"] .titlebar{background:transparent}
.tb-left{display:flex;align-items:center;gap:9px}
.tb-logo-wrap{position:relative;display:grid;place-items:center;width:21px;height:21px;border-radius:6.5px;
  box-shadow:0 1px 1px rgba(0,0,0,.5),0 3px 9px rgba(0,0,0,.42),0 6px 18px rgba(0,0,0,.25)}
.tb-logo{width:21px;height:21px;border-radius:6.5px;display:block}
.tb-logo-wrap::after{content:"";position:absolute;inset:0;border-radius:6.5px;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 1px rgba(0,0,0,.30),inset 0 0 0 1px rgba(255,255,255,.10)}
[data-theme="white"] .tb-logo-wrap{box-shadow:0 1px 1px rgba(0,0,0,.16),0 3px 10px rgba(0,0,0,.16),0 6px 20px rgba(20,20,30,.10)}
[data-theme="white"] .tb-logo-wrap::after{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(20,20,30,.12)}
.tb-title{font-size:12.5px;font-weight:600;color:#c9c9dd;letter-spacing:.2px}
.tb-right{display:flex;height:100%;align-items:center;gap:2px;padding-right:10px}
.win-btn{width:46px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:#9d9db8;transition:background .15s,color .15s;flex-shrink:0}
.win-btn:hover{background:rgba(255,255,255,.10);color:#fff}
.win-btn.close:hover{background:#e81123;color:#fff}
.win-btn svg{display:block;width:16px;height:16px}
.lang-btn{font-size:12.5px;font-weight:600;letter-spacing:.3px}

.shell{position:relative;z-index:1;display:grid;grid-template-columns:300px 1fr;flex:1;min-height:0}
.resizer{position:absolute;top:8px;bottom:8px;left:300px;width:14px;transform:translateX(-50%);
  cursor:col-resize;z-index:40;touch-action:none}
.resizer::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:2px;height:44px;border-radius:2px;background:rgba(255,255,255,.10);transition:background .18s,height .18s,width .18s}
.resizer:hover::after,.resizer.on::after{background:rgba(var(--a1),.55);width:3px;height:72px}
[data-theme="white"] .resizer::after{background:rgba(20,20,30,.10)}
[data-theme="white"] .resizer:hover::after,[data-theme="white"] .resizer.on::after{background:rgba(20,20,30,.45)}

/* 玻璃通用 */
.glass{
  background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.028));
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--stroke);
  box-shadow:0 8px 32px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.07);
}

/* 侧栏 */
aside{padding:16px 16px 22px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;overflow-x:hidden;
  border-right:1px solid rgba(255,255,255,.07);
  background:transparent}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 0}
.logo-img{width:36px;height:36px;border-radius:11px;flex-shrink:0;box-shadow:0 4px 16px rgba(var(--a1),.45)}
.brand h1{font-size:15px;font-weight:650;letter-spacing:.2px}
.brand p{font-size:11px;color:var(--muted);margin-top:2px}

.search{display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:12px;
  background:rgba(255,255,255,.095);border:1px solid rgba(255,255,255,.15);
  box-shadow:0 2px 10px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.07);
  transition:background .16s,border-color .16s,box-shadow .16s}
.search:focus-within{background:rgba(255,255,255,.12);border-color:rgba(var(--a1),.5);
  box-shadow:0 0 0 2px rgba(var(--a1),.16),0 4px 14px rgba(0,0,0,.32)}
.search svg{color:#a8a8c4;flex-shrink:0}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:13px}
.search input::placeholder{color:#8f8faa}
[data-theme="white"] .search:focus-within{background:#fff;border-color:rgba(20,20,30,.28);box-shadow:0 0 0 2px rgba(20,20,30,.08),0 4px 14px rgba(20,20,30,.08)}
.search svg{opacity:.5}

.nav-card{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:16px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 10px 26px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.05)}
[data-theme="white"] .nav-card{background:#ffffff;border-color:rgba(20,20,30,.10);box-shadow:0 2px 10px rgba(20,20,30,.06)}
.nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex:1;min-height:0;padding-right:2px}
.nav-pin{flex:0 0 auto;overflow:visible}
.nav-divider{height:1px;margin:-4px 12px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.20),rgba(255,255,255,0))}
[data-theme="white"] .nav-divider{background:linear-gradient(90deg,rgba(20,20,30,0),rgba(20,20,30,.20),rgba(20,20,30,0))}
.nav-group{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;letter-spacing:0;color:#b9b9cf;
  padding:9px 12px 4px;cursor:pointer;user-select:none;transition:color .16s}
.nav-add{width:19px;height:19px;border-radius:6px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);
  color:#a8a8c4;font-size:12px;line-height:1;display:grid;place-items:center;cursor:pointer;flex-shrink:0;padding:0;transition:.15s}
.nav-add:hover{background:rgba(var(--a1),.22);border-color:rgba(var(--a1),.45);color:#fff}
.nav-right{display:flex;align-items:center;gap:7px;flex-shrink:0}

/* 主题选择弹窗 */
.th-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);z-index:40}
.th-modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;width:min(430px,92vw);
  background:rgba(16,16,22,.95);border:1px solid rgba(255,255,255,.10);border-radius:18px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);animation:thpop .18s ease both}
@keyframes thpop{from{opacity:0;transform:translate(-50%,-50%) scale(.95)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.th-head{display:flex;align-items:baseline;gap:10px;padding:18px 20px 12px;border-bottom:1px solid rgba(255,255,255,.07)}
.th-title{font-size:14px;font-weight:650;color:#fff}
.th-sub{font-size:11px;color:#8f8fa8}
.th-close{margin-left:auto;cursor:pointer;color:#8f8fa8;font-size:13px;line-height:1;padding:4px 6px;border-radius:7px}
.th-close:hover{background:rgba(255,255,255,.10);color:#fff}
.th-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px 20px 20px}
.th-item{cursor:pointer}
.th-swatch{height:62px;border-radius:12px;display:flex;align-items:center;gap:6px;padding:0 13px;
  border:1px solid rgba(255,255,255,.10);transition:transform .14s,box-shadow .14s}
.th-swatch i{width:10px;height:10px;border-radius:50%;display:block}
.th-item:hover .th-swatch{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.th-item.on .th-swatch{box-shadow:0 0 0 2px rgba(255,255,255,.55),0 8px 22px rgba(0,0,0,.35)}
.th-name{margin-top:7px;font-size:12px;color:#cfcfdf;display:flex;align-items:center;gap:6px}
.th-name em{font-style:normal;font-size:10px;color:#a5b4fc;border:1px solid rgba(165,180,252,.35);border-radius:6px;padding:1px 5px}
.th-item:hover .th-name{color:#fff}
.th-swatch.sw-black{background:#000}
.th-swatch.sw-black i:nth-child(1){background:#ffffff}
.th-swatch.sw-black i:nth-child(2){background:#d6d6e0}
.th-swatch.sw-black i:nth-child(3){background:#6e6e86}
.th-swatch.sw-white{background:#ffffff;border-color:rgba(20,20,30,.12)}
.th-swatch.sw-white i:nth-child(1){background:#15151d}
.th-swatch.sw-white i:nth-child(2){background:#3c3c50}
.th-swatch.sw-white i:nth-child(3){background:#c8c8d6}
.th-swatch.sw-amber{background:linear-gradient(135deg,#140d03,#2a1907)}
.th-swatch.sw-amber i:nth-child(1){background:#f59e0b}
.th-swatch.sw-amber i:nth-child(2){background:#fbbf24}
.th-swatch.sw-amber i:nth-child(3){background:#fde68a}
.th-swatch.sw-violet{background:linear-gradient(135deg,#0b0a18,#191434)}
.th-swatch.sw-violet i:nth-child(1){background:#7c6cf0}
.th-swatch.sw-violet i:nth-child(2){background:#a78bfa}
.th-swatch.sw-violet i:nth-child(3){background:#c4b5fd}
[data-theme="white"] .th-modal{background:#fff;border-color:rgba(20,20,30,.12)}
[data-theme="white"] .th-head{border-color:rgba(20,20,30,.08)}
[data-theme="white"] .th-title{color:#15151d}
[data-theme="white"] .th-sub{color:#7a7a8e}
[data-theme="white"] .th-close{color:#6b6b7d}
[data-theme="white"] .th-close:hover{background:rgba(20,20,30,.07);color:#111}
[data-theme="white"] .th-name{color:#3a3a50}
[data-theme="white"] .th-name em{color:#4f46e5;border-color:rgba(79,70,229,.30)}
[data-theme="white"] .th-item:hover .th-name{color:#111}

/* 待纳管面板 */

.pending.hide{display:none}

/* 居中提示 */
.toast{position:fixed;left:50%;top:50%;z-index:58;transform:translate(-50%,-50%) scale(.88);opacity:0;pointer-events:none;
  padding:22px 30px;border-radius:20px;text-align:center;min-width:250px;
  background:linear-gradient(180deg,rgba(30,30,45,.92),rgba(18,18,30,.92));
  backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(52,211,153,.30);box-shadow:0 24px 70px rgba(0,0,0,.65),0 0 0 1px rgba(52,211,153,.10),inset 0 1px 0 rgba(255,255,255,.10);
  transition:opacity .28s,transform .28s cubic-bezier(.2,.9,.3,1.2)}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.drag-tip{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.9);z-index:62;opacity:0;
  pointer-events:none;padding:20px 32px;border-radius:18px;text-align:center;max-width:70vw;
  background:rgba(12,12,20,.86);border:1px solid rgba(var(--a1),.4);
  box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(var(--a1),.12);
  backdrop-filter:blur(18px) saturate(150%);transition:opacity .16s,transform .16s}
.drag-tip.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.drag-tip .dt-main{font-size:22px;font-weight:700;color:#fff;letter-spacing:.3px}
.drag-tip .dt-sub{margin-top:8px;font-size:13px;color:#a9a9c4}
.drag-tip.warn{border-color:rgba(251,191,36,.5);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(251,191,36,.16)}
.drag-tip.warn .dt-main{color:#fde68a}
[data-theme="white"] .drag-tip{background:rgba(255,255,255,.94);border-color:rgba(20,20,30,.16)}
[data-theme="white"] .drag-tip .dt-main{color:#15151d}
[data-theme="white"] .drag-tip .dt-sub{color:#6b6b7d}
[data-theme="white"] .drag-tip.warn{border-color:rgba(245,158,11,.5)}
[data-theme="white"] .drag-tip.warn .dt-main{color:#a16207}
.toast .ok{width:46px;height:46px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#04140d;
  background:linear-gradient(135deg,#34d399,#4ade80);box-shadow:0 8px 26px rgba(74,222,128,.40)}
.toast h4{font-size:15px;font-weight:650;color:#fff;margin-bottom:5px}
.toast p{font-size:12px;color:#a9a9c4;line-height:1.6}

.ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:14px;font-weight:700;flex-shrink:0;border:1px solid rgba(255,255,255,.14);letter-spacing:.5px}

/* 抽屉 */

.drawer{
  position:fixed;top:60px;right:14px;bottom:14px;width:min(480px,92vw);z-index:10;
  border-radius:24px;transform:translateX(calc(100% + 20px));transition:transform .32s cubic-bezier(.3,.9,.35,1);

}

.x:hover{background:rgba(255,255,255,.13)}

.tab.on{color:#fff;background:rgba(var(--a1),.22);border:1px solid rgba(var(--a1),.35)}
.d-body{flex:1;overflow-y:auto;padding:16px 22px 24px;font-size:12.5px;line-height:1.75;color:#b9b9cf}

.code{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;font-family:Consolas,monospace;font-size:11.5px;line-height:1.7;color:#c9c9dd;white-space:pre-wrap;word-break:break-word}

.drag-hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);z-index:60;
  padding:9px 17px;border-radius:12px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:.18s;
  background:rgba(18,18,28,.94);border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(18px);color:#cfcfdd;box-shadow:0 12px 32px rgba(0,0,0,.5)}

/* 首次使用说明 */
.onb-overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.62);backdrop-filter:blur(4px)}
.onb{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:71;
  width:min(760px,90vw);max-height:88vh;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;
  background:rgba(16,16,22,.98);border:1px solid rgba(var(--a1),.30);
  box-shadow:0 30px 90px rgba(0,0,0,.8),0 0 0 1px rgba(var(--a1),.10)}
.onb-head{padding:22px 26px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.onb-title{font-size:19px;font-weight:650;color:#fff}
.onb-sub{margin-top:6px;font-size:12.5px;color:#8f8fa8}
.onb-body{flex:1;overflow-y:auto;padding:18px 26px 8px;font-size:13.5px;line-height:1.8;color:#c9c9dd}
.onb-body section{margin-bottom:18px}
.onb-body h4{font-size:14.5px;font-weight:650;color:#fff;margin-bottom:7px}
.onb-body p{margin:6px 0}
.onb-body ol,.onb-body ul{margin:6px 0 6px 4px;padding-left:20px}
.onb-body li{margin:3px 0}
.onb-body code{background:rgba(255,255,255,.09);border-radius:5px;padding:1.5px 6px;font-size:12px;
  font-family:Consolas,"Cascadia Mono",monospace;color:#fde68a}
.onb-body strong{color:#fff;font-weight:600}
.onb-warn{background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.26);border-radius:12px;padding:14px 16px}
.onb-warn h4{color:#fde68a}
.onb-note{margin-top:8px;font-size:12.5px;color:#a9a9c4;border-left:2px solid rgba(251,191,36,.5);padding-left:10px}
.onb-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 26px 18px;border-top:1px solid rgba(255,255,255,.08)}
.onb-hint{font-size:11.5px;color:#6f6f88}
/* 分页式首次说明 */
.onb-dots{display:flex;gap:6px;justify-content:center;padding:16px 0 4px}
.onb-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18);transition:.2s}
.onb-dot.on{background:rgba(var(--a1),.85);width:18px;border-radius:3px}
.onb-body{padding:8px 26px 4px;overflow-y:auto}

/* 聚光灯导览 */
.tour-mask{position:fixed;background:rgba(0,0,0,.62);z-index:80;pointer-events:none;transition:.12s}
.tour-hole{position:fixed;z-index:81;pointer-events:none;border-radius:12px;
  border:2px solid rgba(var(--a1),.85);
  box-shadow:0 0 0 4px rgba(var(--a1),.18),0 0 34px rgba(var(--a1),.28);
  transition:all .16s ease}
.tour-card{position:fixed;z-index:82;padding:18px 20px 16px;border-radius:16px;
  background:rgba(18,18,26,.98);border:1px solid rgba(var(--a1),.32);
  box-shadow:0 24px 70px rgba(0,0,0,.75);transition:left .16s ease,top .16s ease}
.tour-step{font-size:12px;letter-spacing:.5px;color:rgba(var(--a1),.85);font-weight:600}
.tour-t{margin-top:6px;font-size:19px;font-weight:650;color:#fff;line-height:1.4}
.tour-d{margin-top:9px;font-size:14.5px;line-height:1.9;color:#c3c3d6;white-space:pre-line}
.tour-hint{display:none;margin-top:12px;padding:10px 13px;border-radius:10px;
  background:rgba(var(--a1),.13);border-left:3px solid rgba(var(--a1),.75);
  font-size:13.5px;line-height:1.85;color:#e6e6f5;white-space:pre-line}
[data-theme="white"] .tour-hint{background:rgba(20,20,30,.05);color:#26263a}
.tour-acts{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.tour-nav{display:flex;gap:8px}
.tour-acts .btn{padding:8px 15px;font-size:13.5px}
[data-theme="white"] .tour-card{background:rgba(255,255,255,.99);border-color:rgba(20,20,30,.14)}
[data-theme="white"] .tour-t{color:#15151d}
[data-theme="white"] .tour-d{color:#4a4a60}
[data-theme="white"] .tour-step{color:#8a5a00}
.onb-page{display:none}
.onb-page.on{display:block;animation:onbIn .22s ease both}
@keyframes onbIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.onb-t{font-size:19px;font-weight:650;color:#fff;letter-spacing:.2px;line-height:1.4}
.onb-d{margin-top:10px;font-size:13.5px;line-height:1.85;color:#b9b9cf}
.onb-fig{margin:18px 0 14px;padding:18px;border-radius:14px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08)}
.fig-row{display:flex;align-items:center;justify-content:center;gap:14px}
.fig-col{display:flex;flex-direction:column;gap:8px}
.fig-box{min-width:96px;padding:10px 14px;border-radius:10px;text-align:center;
  font-size:12.5px;color:#d9d9e8;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.fig-box.main{background:rgba(var(--a1),.16);border-color:rgba(var(--a1),.42);color:#fff;font-weight:600}
.fig-sub{margin-top:3px;font-size:10.5px;font-weight:400;color:#8f8fa8}
.fig-arrow{color:rgba(var(--a1),.7);font-size:16px}
.fig-steps{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.fig-step{display:flex;align-items:center;gap:6px;font-size:12px;color:#c9c9dd;
  padding:9px 13px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.fig-step i{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;
  font-style:normal;font-size:10px;font-weight:700;color:#0a0a0d;background:rgba(var(--a1),.9)}
.fig-code{font-family:Consolas,"Cascadia Mono",monospace;font-size:11.5px;line-height:1.75;color:#b9b9cf;white-space:pre}
.onb-tips{margin:0;padding-left:18px;color:#8f8fa8;font-size:12px;line-height:1.9}
.onb-tips li{margin:2px 0}
.onb-nav{display:flex;align-items:center;gap:10px}
.onb-count{font-size:11.5px;color:#6f6f88;min-width:42px;text-align:center}
[data-theme="white"] .onb-t{color:#15151d}
[data-theme="white"] .onb-d{color:#4a4a60}
[data-theme="white"] .onb-fig{background:#f7f7f9;border-color:rgba(20,20,30,.10)}
[data-theme="white"] .fig-box{background:#fff;border-color:rgba(20,20,30,.14);color:#26263a}
[data-theme="white"] .fig-box.main{background:rgba(20,20,30,.06);border-color:rgba(20,20,30,.22);color:#15151d}
[data-theme="white"] .fig-step{background:#fff;border-color:rgba(20,20,30,.12);color:#3a3a50}
[data-theme="white"] .fig-code{color:#3a3a50}

[data-theme="white"] .onb{background:rgba(255,255,255,.99);border-color:rgba(20,20,30,.16)}
[data-theme="white"] .onb-title,[data-theme="white"] .onb-body h4,[data-theme="white"] .onb-body strong{color:#15151d}
[data-theme="white"] .onb-body{color:#3a3a50}
[data-theme="white"] .onb-body code{background:rgba(20,20,30,.07);color:#8a5a00}
[data-theme="white"] .onb-warn{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.30)}
[data-theme="white"] .onb-warn h4{color:#a16207}

.empty{padding:60px 0;text-align:center;color:var(--muted);font-size:13px}

/* 只读阅读 */
.rd-overlay{position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.rd{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:45;
  width:min(920px,88vw);height:86vh;display:none;flex-direction:column;border-radius:20px;overflow:hidden;
  background:rgba(16,16,22,.97);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 30px 90px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.08)}
.rd.on{display:flex}
.rd-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding:18px 22px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.rd-title{font-size:17px;font-weight:650;color:#fff;word-break:break-all}
.rd-title .cn{margin-left:9px;font-size:13px;font-weight:400;color:var(--muted)}
.rd-sub{margin-top:5px;font-size:11.5px;color:#7d7d95;font-family:Consolas,"Cascadia Mono",monospace;word-break:break-all}
.rd-acts{display:flex;align-items:center;gap:8px;flex-shrink:0}
.rd-body{flex:1;overflow-y:auto;padding:20px 30px 30px;font-size:14px;line-height:1.85;color:#c9c9dd}
.rd-meta{margin:0 0 18px;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:6px}
.rd-kv{display:flex;gap:12px;font-size:12.5px;line-height:1.6}
.rd-kv span{flex-shrink:0;width:92px;color:#7d7d95;font-family:Consolas,"Cascadia Mono",monospace}
.rd-kv b{color:#d9d9e8;font-weight:500;word-break:break-word}
.rd-body table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.rd-body th,.rd-body td{border:1px solid rgba(255,255,255,.12);padding:7px 11px;text-align:left;vertical-align:top}
.rd-body th{background:rgba(255,255,255,.06);color:#fff;font-weight:600}
.rd-body td{color:#c3c3d6}
.rd-body h1{font-size:21px;font-weight:650;color:#fff;margin:18px 0 10px}
.rd-body h2{font-size:17px;font-weight:650;color:#fff;margin:22px 0 9px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
.rd-body h3{font-size:15px;font-weight:600;color:#e6e6f0;margin:18px 0 7px}
.rd-body h4{font-size:14px;font-weight:600;color:#cfcfe0;margin:14px 0 6px}
.rd-body p{margin:8px 0}
.rd-body p.ol{margin:6px 0}
.rd-body ul{margin:8px 0 8px 4px;padding-left:18px}
.rd-body li{margin:4px 0}
.rd-body code{background:rgba(255,255,255,.09);border-radius:5px;padding:1.5px 5px;font-size:12.5px;
  font-family:Consolas,"Cascadia Mono",monospace;color:#fde68a}
.rd-body pre{margin:12px 0;padding:14px 16px;border-radius:12px;background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.08);overflow-x:auto}
.rd-body pre code{background:none;padding:0;color:#c9c9dd;font-size:12.5px;line-height:1.7}
.rd-body blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid rgba(var(--a1),.5);
  background:rgba(var(--a1),.07);border-radius:0 8px 8px 0;color:#b9b9cf}
.rd-body hr{border:none;border-top:1px solid rgba(255,255,255,.10);margin:18px 0}
.rd-body a{color:var(--t1);text-decoration:underline;text-underline-offset:2px}
.rd-body strong{color:#fff;font-weight:600}
.rd-foot{padding:10px 22px;border-top:1px solid rgba(255,255,255,.08)}
.rd-hint{font-size:11px;color:#6f6f88}
[data-theme="white"] .rd{background:rgba(255,255,255,.99);border-color:rgba(20,20,30,.12)}
[data-theme="white"] .rd-title,[data-theme="white"] .rd-body h1,[data-theme="white"] .rd-body h2,
[data-theme="white"] .rd-body strong{color:#15151d}
[data-theme="white"] .rd-body{color:#3a3a50}
[data-theme="white"] .rd-body h3,[data-theme="white"] .rd-body h4{color:#26263a}
[data-theme="white"] .rd-body code{background:rgba(20,20,30,.07);color:#8a5a00}
[data-theme="white"] .rd-body pre{background:#f5f5f7;border-color:rgba(20,20,30,.10)}
[data-theme="white"] .rd-body pre code{color:#26263a}::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ===== 字号整体上调一档（覆盖上面的值，保持层级差） ===== */
.app .brand h1{font-size:16.5px}
.app .brand p{font-size:12px}
.app .search input{font-size:14.5px}
#navPin .nav-item,#navFoot .nav-item,.app .nav-item.nav-primary{font-size:15px}
.app .nav-item{font-size:14px}
.app .nav-group{font-size:15px}
.app .nav-sub .lbl-t{font-size:14px}
.app .nav-skill{font-size:13px}
.app .nav-skill.deep{font-size:12.5px}
.app .nav-item .cnt{font-size:12px}
.app .side-foot{font-size:12px}
.app .tb-title{font-size:13.5px}
.app .title h2{font-size:23px}
.app .title p{font-size:13px}
.app .btn{font-size:14px}
.app .sort-sel{font-size:13.5px}
.app .card h3{font-size:16px}
.app .card h3 .cn{font-size:14px}
.app .card .desc{font-size:13.5px}
.app .badge{font-size:11.5px}
.app .mini{font-size:12.5px}
.app .mini.link{font-size:13.5px}
.app .card-foot .mtime{font-size:11.5px}
.app .ico{font-size:15px}
.app .d-head h3{font-size:18.5px}
.app .d-head p{font-size:13px}
.app .tab{font-size:13.5px}
.app .d-body{font-size:13.5px}
.app .kv dt{font-size:13px}
.app .section-t{font-size:13px}
.app .log-item .m{font-size:13px}
.app .lp-title{font-size:16px}
.app .lp-sub{font-size:13px}
.app .lp-item .nm{font-size:13.5px}
.app .lp-note{font-size:12.5px}
.app .lp-acts .btn{font-size:13.5px}
.app .toast h4{font-size:16px}
.app .toast p{font-size:13px}
.app .pending-h{font-size:12.5px}
.app .p-item .t{font-size:12.5px}
.app .p-item .t i{font-size:11.5px}
.app .p-btn{font-size:11.5px}
.app .confirmbar .cb-t,.app .confirmbar .cb-d{font-size:12.5px}
.app .cb-btn{font-size:12.5px}
.app .cb-note{font-size:11.5px}
.app .drag-tip .dt-main{font-size:24px}
.app .drag-tip .dt-sub{font-size:14px}
.app .empty{font-size:14.5px}
.app .ed-title{font-size:14.5px}
.app .ed-sub{font-size:12.5px}
.app .ed textarea,.ed textarea{font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div class="aurora"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
  <div class="titlebar">
    <div class="tb-left">
      <span class="tb-logo-wrap"><img class="tb-logo" src="/static/icon-black-128.png?v=2" alt=""></span>
      <span class="tb-title">SKILL本地管理</span>
    </div>
    <div class="tb-right">
      <div class="win-btn lang-btn" id="btnLang" title="中文 / English">中</div>
      <div class="win-btn" id="btnHelp" title="使用说明">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M9.2 9.3a2.9 2.9 0 1 1 3.9 2.7c-.7.3-1.1 1-1.1 1.7v.3"/>
          <circle cx="12" cy="17" r=".8" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <div class="win-btn" id="btnTheme">
        <svg width="13" height="13" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.1" fill="none" stroke="currentColor" stroke-width="1.15"/><path d="M8 1.9a6.1 6.1 0 0 0 0 12.2z" fill="currentColor"/></svg>
      </div>
      <div class="win-btn" id="btnMin">
        <svg width="12" height="12" viewBox="0 0 12 12"><line x1="2.5" y1="6" x2="9.5" y2="6" stroke="currentColor" stroke-width="1.1"/></svg>
      </div>
      <div class="win-btn" id="btnMax">
        <svg width="12" height="12" viewBox="0 0 12 12"><rect x="3" y="3" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      </div>
      <div class="win-btn close" id="btnClose">
        <svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.1"/></svg>
      </div>
    </div>
  </div>

<div class="shell">
  <aside>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="搜索技能…" data-i18n-ph="search.ph">
    </div>
    <div class="agent-bar">
      <button class="agent-switch" id="agentSwitch" title="切换 agent（各自独立仓库与全局目录）">
        <span id="agentSwitchLabel">DSH</span><span class="as-arrow">▾</span>
      </button>
      <button class="agent-set" id="agentSettings" title="设置：管理 agent 与路径">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.14.37.44.66.81.82H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
    <div class="nav-card">
      <nav class="nav nav-pin" id="navPin"></nav>
      <div class="nav-divider"></div>
      <nav class="nav" id="nav"></nav>
      <div class="nav-divider"></div>
      <nav class="nav nav-pin" id="navFoot"></nav>
    </div>
    <div class="confirmbar" id="confirmbar">
      <div class="cb-t">↗ 待确认迁移</div>
      <div class="cb-d" id="cbDesc">—</div>
      <div class="cb-acts">
        <div class="cb-btn" id="cbCancel">取消</div>
        <div class="cb-btn go" id="cbOk">确认</div>
      </div>
    </div>
    <div class="pending" id="pending">
      <div class="pending-h"><span>待纳管</span><span class="n" id="pendCount">0</span><span class="pend-x" id="pendClose" title="关闭（有新技能会重新出现）">✕</span></div>
      <div id="pendList"></div>
    </div>
    <div class="restart-tip" id="restartTip">
      <span class="rt-ico">⟳</span>
      <div class="rt-body">
        <div class="rt-t">挂载已变更</div>
        <div class="rt-d">新对话生效 · 个别客户端需重启</div>
      </div>
      <span class="rt-x" id="rtClose" title="我知道了">✕</span>
    </div>
    <div class="side-foot" id="hubFoot" title="点击在资源管理器中打开">
      hub <b class="hub-path">…\SKILL本地管理\data\hub</b><br>
      <span data-i18n="foot.hub">已纳入</span> <b id="hubCount">3</b> · <span data-i18n="foot.links">链接</span> <b id="linkCount">4</b>
    </div>
  </aside>

  <div class="resizer" id="navResizer" title="拖动调整侧栏宽度（双击恢复默认）"></div>

  <main>
    <div class="topbar">
      <div class="title"><h2 id="viewTitle">全部</h2><p id="viewSub">共 12 个技能</p></div>
      <div class="actions">
        <select class="sort-sel" id="sortBy" title="排序方式">
          <option value="name" data-i18n="sort.name">按名称</option>
          <option value="time" data-i18n="sort.time">按修改时间</option>
          <option value="size" data-i18n="sort.size">按大小</option>
        </select>
        <button class="btn" id="btnRefresh" title="重新扫描本地技能目录">
          <svg class="rfc-ico" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.6 8a5.6 5.6 0 1 1-1.7-4"/>
            <path d="M13.6 2.1v3.2h-3.2"/>
          </svg>
          <span data-i18n="btn.refresh">刷新</span>
        </button>
        <button class="btn" id="btnHistory" data-i18n="btn.history">查看历史</button>
        <button class="btn" id="btnCreate">＋ <span data-i18n="btn.new">新建</span></button>
        <button class="btn primary" id="btnImport" data-i18n="btn.import">导入技能</button>
      </div>
    </div>
    <div class="grid-wrap"><div class="grid" id="grid"></div></div>
  </main>
</div>
</div>

<div class="overlay" id="overlay"></div>
<div class="drawer glass" id="drawer">
  <div class="d-head">
    <div><h3 id="dName">—</h3><p id="dDesc">—</p></div>
    <div class="x" id="dClose">✕</div>
  </div>
  <div class="tabs">
    <div class="tab on" data-tab="overview" data-i18n="tab.overview">概览</div>
    <div class="tab" data-tab="links" data-i18n="tab.links">链接</div>
    <div class="tab" data-tab="history" data-i18n="tab.history">历史</div>
  </div>
  <div class="d-body" id="dBody"></div>
</div>

<div class="toast" id="toast">
  <div class="ok">✓</div>
  <h4 id="toastTitle">已链接</h4>
  <p id="toastMsg">—</p>
</div>

<div class="drag-tip" id="dragTip">
  <div class="dt-main" id="dtMain"></div>
  <div class="dt-sub" id="dtSub"></div>
</div>

<script src="/static/app.js"></script>

</body>
</html>
